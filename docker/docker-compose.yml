# =========================================================================
# Docker Compose - Multi-Container Smart Warehouse Cloud Stack
# Cloud Computing Unit 3: Container Orchestration & Microservices
# =========================================================================

version: '3.8'

services:
  # Microservice 1: MySQL 8.0 Relational Database Cluster Node
  db:
    image: mysql:8.0
    container_name: warehouse-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: warehouse_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_storage:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - warehouse_net

  # Microservice 2: Redis High-Speed In-Memory Cache & Session Lock
  redis:
    image: redis:7-alpine
    container_name: warehouse-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - warehouse_net

  # Microservice 3: Python Flask Cloud-Native Web Application
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: warehouse-webapp
    restart: always
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: warehouse_db
      REDIS_HOST: redis
      ENVIRONMENT: Docker-Compose
    depends_on:
      db:
        condition: service_healthy
    networks:
      - warehouse_net

volumes:
  mysql_storage:
    name: warehouse_mysql_persistent_data

networks:
  warehouse_net:
    driver: bridge
