apiVersion: v1
kind: Namespace
metadata:
  name: smart-warehouse
  labels:
    app.kubernetes.io/name: smart-warehouse
    environment: production
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: warehouse-config
  namespace: smart-warehouse
data:
  DB_HOST: "mysql-service"
  DB_PORT: "3306"
  DB_NAME: "warehouse_db"
  PORT: "5000"
  HOST: "0.0.0.0"
  ENVIRONMENT: "Kubernetes-Cloud"
---
apiVersion: v1
kind: Secret
metadata:
  name: warehouse-secrets
  namespace: smart-warehouse
type: Opaque
stringData:
  DB_USER: "root"
  DB_PASSWORD: "rootpassword123"
  SECRET_KEY: "k8s-cloud-smart-warehouse-secret-key-2026"
